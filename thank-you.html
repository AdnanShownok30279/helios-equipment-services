<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Helios Equipment Services | Thank you</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Hanken+Grotesk:wght@300;400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --navy: #0a1f33;
    --steel: #5e7083;
    --paper: #ffffff;
    --gold: #c29a4b;
    --font: "Hanken Grotesk", "Segoe UI", system-ui, -apple-system, sans-serif;
  }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 32px 16px;
         font-family: var(--font); color: #e8eef4; background: var(--navy); }
  main { max-width: 560px; }
  .mark { display: flex; align-items: center; gap: 12px; font-weight: 600; font-size: 15px; margin-bottom: 40px; }
  .mark svg { width: 30px; height: 30px; }
  .rule { width: 44px; height: 2px; background: var(--gold); margin: 0 0 22px; }
  h1 { font-weight: 300; font-size: clamp(2rem, 6vw, 3rem); line-height: 1.1; letter-spacing: -0.02em; margin: 0 0 18px; color: #fff; }
  p { margin: 0 0 14px; color: #9fb2c4; font-size: 17px; line-height: 1.6; }
  a { color: var(--gold); text-decoration: none; font-weight: 500; }
  a:hover { text-decoration: underline; }
  .back { display: inline-block; margin-top: 24px; }
</style>
</head>
<body>
<main>
  <div class="mark">
    <svg viewBox="0 0 32 32" aria-hidden="true"><circle cx="16" cy="16" r="6" fill="#c29a4b"/><g stroke="#c29a4b" stroke-width="2" stroke-linecap="round"><path d="M16 2v5M16 25v5M2 16h5M25 16h5M6.1 6.1l3.5 3.5M22.4 22.4l3.5 3.5M6.1 25.9l3.5-3.5M22.4 9.6l3.5-3.5"/></g></svg>
    Helios Equipment Services
  </div>
  <div class="rule"></div>
  <h1 id="title">Thank you, we have your request.</h1>
  <p id="message">We will confirm by email with your case number. If you reply to that email, your message is added to the same case.</p>
  <a class="back" href="index.html">Back to Helios Equipment Services</a>
</main>
<script>
  // The forms return here with ?from=support or ?from=enquiry.
  var from = new URLSearchParams(window.location.search).get('from');
  if (from === 'enquiry') {
    document.getElementById('title').textContent = 'Thank you for your enquiry.';
    document.getElementById('message').textContent =
      'A member of our sales team will contact you shortly. A confirmation is on its way to your inbox.';
  }
</script>
</body>
</html>
